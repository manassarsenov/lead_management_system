<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadManager - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main_base.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="app-container">
    <!-- Sidebar Placeholder - JS orqali yuklanadi -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header Placeholder - JS orqali yuklanadi -->
        <div id="header-placeholder"></div>

        <!-- Page Content -->
        <main class="page-content" id="page-content">
                <div class="page-header">
                    <h1 class="page-title">Dashboard</h1>
                    <p class="page-subtitle">Overview of your leads performance</p>
                </div>

                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon total">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <p class="stat-label">Total Leads</p>
                            <p class="stat-value" id="stat-total-leads">0</p>
                            <p class="stat-change positive" id="growth-total">+0%</p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon new">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="8" x2="12" y2="16"/>
                                <line x1="8" y1="12" x2="16" y2="12"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <p class="stat-label">New</p>
                            <p class="stat-value" id="stat-new-leads">0</p>
                            <p class="stat-change positive" id="growth-new">+0%</p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon contacted">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <p class="stat-label">Contacted</p>
                            <p class="stat-value" id="stat-contacted-leads">0</p>
                            <p class="stat-change positive" id="growth-contacted">+0%</p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon qualified">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                <polyline points="22 4 12 14.01 9 11.01"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <p class="stat-label">Qualified</p>
                            <p class="stat-value" id="stat-qualified-leads">0</p>
                            <p class="stat-change positive" id="growth-qualified">+0%</p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon won">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
                                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
                                <path d="M4 22h16"/>
                                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
                                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
                                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <p class="stat-label">Won</p>
                            <p class="stat-value" id="stat-won-leads">0</p>
                            <p class="stat-change positive" id="growth-won">+0%</p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon lost">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="15" y1="9" x2="9" y2="15"/>
                                <line x1="9" y1="9" x2="15" y2="15"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <p class="stat-label">Lost</p>
                            <p class="stat-value" id="stat-lost-leads">0</p>
                            <p class="stat-change negative" id="growth-lost">-0%</p>
                        </div>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="charts-section">
                    <div class="chart-card">
                        <div class="chart-header">
                            <h3 class="chart-title">Leads Trend</h3>
                            <select class="chart-filter">
                                <option>Last 7 days</option>
                                <option>Last 30 days</option>
                                <option>Last 90 days</option>
                            </select>
                        </div>
                        <div class="chart-body">
                            <canvas id="leadsTrendChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-header">
                            <h3 class="chart-title">Lead Sources</h3>
                        </div>
                        <div class="chart-body">
                            <canvas id="leadSourcesChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Recent Leads Table -->
                <div class="recent-leads-section">
                    <div class="section-header">
                        <h3 class="section-title">Recent Leads</h3>
                        <a href="leads_list.html" class="view-all-link">View All</a>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Phone/Email</th>
                                    <th>Source</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="recent-leads-tbody">
                                <!-- Dynamic leads will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
        </main>
    </div>
</div>

<!-- Modals Placeholder - JS orqali yuklanadi -->
<div id="modals-placeholder"></div>

<!-- Toasts Placeholder - JS orqali yuklanadi -->
<div id="toasts-placeholder"></div>

<!-- Component Loader -->
<script src="js/component_loader.js"></script>
<!-- Main Base JS -->
<script src="js/main_base.js"></script>
<!-- Dashboard JS -->
<script src="js/dashboard.js"></script>
</body>
</html>
