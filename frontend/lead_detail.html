<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadManager - Lead Detail</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main_base.css">
    <link rel="stylesheet" href="css/lead_detail.css">
</head>
<body>
<div class="app-container">
    <!-- Sidebar Placeholder - JS orqali yuklanadi -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header Placeholder - JS orqali yuklanadi -->
        <div id="header-placeholder"></div>

        <!-- Page Content -->
        <main class="page-content" id="page-content">
                <div class="page-header">
                    <div class="header-left">
                        <a href="leads_list.html" class="back-link">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="15 18 9 12 15 6"/>
                            </svg>
                            Back to Leads
                        </a>
                        <h1 class="page-title">Lead Detail</h1>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-secondary" onclick="editLead()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                            Edit
                        </button>
                        <button class="btn btn-danger" onclick="deleteLead()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                            Delete
                        </button>
                    </div>
                </div>

                <div class="lead-detail-grid">
                    <!-- Lead Info Card -->
                    <div class="lead-info-card">
                        <div class="lead-header">
                            <div class="lead-avatar-large" id="lead-avatar">LD</div>
                            <div class="lead-header-info">
                                <h2 class="lead-name" id="lead-name">Loading...</h2>
                                <div id="lead-status-badge-container"></div>
                            </div>
                        </div>

                        <div class="info-section">
                            <h3 class="section-title">Contact Information</h3>
                            <div class="info-grid">
                                <div class="info-item">
                                    <span class="info-label">Phone</span>
                                    <span class="info-value" id="lead-phone">-</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Email</span>
                                    <span class="info-value" id="lead-email">-</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Source</span>
                                    <span class="info-value" id="lead-source">-</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Status</span>
                                    <span class="info-value" id="lead-status">-</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Created</span>
                                    <span class="info-value" id="lead-created">-</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Last Contacted</span>
                                    <span class="info-value" id="lead-last-contacted">-</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Assigned To</span>
                                    <span class="info-value" id="lead-assigned">-</span>
                                </div>
                            </div>
                        </div>

                        <div class="status-change-section">
                            <h3 class="section-title">Change Status</h3>
                            <select class="status-select" id="status-select">
                                <option value="new">New</option>
                                <option value="contacted">Contacted</option>
                                <option value="qualified">Qualified</option>
                                <option value="won">Won</option>
                                <option value="lost">Lost</option>
                            </select>
                            <button class="btn btn-primary btn-full" onclick="changeStatus()">Update Status</button>
                        </div>

                        <div class="quick-actions">
                            <h3 class="section-title">Quick Actions</h3>
                            <div class="action-buttons-grid">
                                <button class="quick-action-btn" onclick="callLead()">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                                    </svg>
                                    Call
                                </button>
                                <button class="quick-action-btn" onclick="sendEmail()">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                        <polyline points="22,6 12,13 2,6"/>
                                    </svg>
                                    Send Email
                                </button>
                                <button class="quick-action-btn" onclick="addNote()">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                    </svg>
                                    Add Note
                                </button>
                                <button class="quick-action-btn danger" onclick="markAsLost()">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"/>
                                        <line x1="15" y1="9" x2="9" y2="15"/>
                                        <line x1="9" y1="9" x2="15" y2="15"/>
                                    </svg>
                                    Mark as Lost
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Activity Timeline -->
                    <div class="activity-card">
                        <div class="activity-header">
                            <h3 class="section-title">Activity Timeline</h3>
                            <span class="activity-count" id="activity-count">0 activities</span>
                        </div>

                        <div class="activity-tabs">
                            <button class="activity-tab active" data-tab="activity">Activity</button>
                            <button class="activity-tab" data-tab="notes">Notes</button>
                            <button class="activity-tab" data-tab="history">History</button>
                        </div>

                        <div class="activity-timeline" id="activity-timeline">
                            <!-- Dynamic activities inserted here -->
                        </div>
                    </div>
                </div>
        </main>
    </div>
</div>

<!-- Modals Placeholder - JS orqali yuklanadi -->
<div id="modals-placeholder"></div>

<!-- Toasts Placeholder - JS orqali yuklanadi -->
<div id="toasts-placeholder"></div>

<!-- Component Loader -->
<script src="js/component_loader.js"></script>
<!-- Main Base JS -->
<script src="js/main_base.js"></script>
<!-- Lead Detail JS -->
<script src="js/lead_detail.js"></script>
</body>
</html>
